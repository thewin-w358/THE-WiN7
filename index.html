.input-group{margin-bottom:12px;text-align:left} label{display:block;margin-bottom:5px;color:#ffd56b}
input{width:100%;padding:12px;border-radius:8px;border:none}
button{width:100%;padding:15px;border:none;border-radius:10px;background:#ff6b00;color:white;font-size:18px;cursor:pointer;margin-top:15px}
.progress-container{width:100%;height:25px;background:#222;border-radius:20px;overflow:hidden;border:1px solid #ffae00}
.progress-bar{width:0;height:100%;background:linear-gradient(90deg,#ff6600,#ffcc00,#ff6600)}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#16071f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="古神巴風特">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

</head>
<body>
<div class="overlay">
<div class="login-box" id="loginPage">
<h1>古神巴風特 AI選房系統</h1>
<h3>DOIN經銷商W358專屬</h3>
<input type="password" id="password" placeholder="請輸入密碼">
<br><br><button onclick="login()">進入系統</button>
</div>

<div class="main-box" id="mainPage" style="display:none;">
<h1>古神巴風特 AI選房系統</h1>
<h3>DOIN經銷商W358專屬</h3>
<div>分析房號開出機率</div>
<div class="result-box" id="resultBox">--</div>

<div id="scanArea" style="display:none">
<div id="scanMessage" style="color:#ffcc66;margin-bottom:10px">正在讀取數據...</div>
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
<div id="progressText" style="margin-top:8px">0%</div>
</div>

<div class="input-group"><label>未開轉數分析</label><input id="v1" value="11"></div>
<div class="input-group"><label>前一轉開分析</label><input id="v2" value="5"></div>
<div class="input-group"><label>前二轉開分析</label><input id="v3" value="192"></div>
<div class="input-group"><label>得分率分析</label><input id="v4" value="97.83"></div>
<div class="input-group"><label>總下注額分析</label><input id="v5" value="210076.0"></div>

<button onclick="calculate()">開始AI分析</button>
</div></div>

<script>
function login(){if(password.value==='aaa888'){loginPage.style.display='none';mainPage.style.display='block';}else alert('密碼錯誤');}
function makeSeed(str){let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}return Math.abs(h);}
function calculate(){
let vals=['v1','v2','v3','v4','v5'].map(id=>document.getElementById(id).value.trim());
for(let v of vals){if(v===''||isNaN(v.replace(/,/g,''))){alert('所有欄位都必須輸入數字');return;}}
scanArea.style.display='block';
resultBox.innerHTML='分析計算中...';
const msgs=['正在讀取數據...','正在分析房號歷史紀錄...','AI神諭演算中...','正在建立機率模型...','巴風特正在解析結果...','古神預測引擎運行中...'];
let mt=setInterval(()=>scanMessage.innerHTML=msgs[Math.floor(Math.random()*msgs.length)],1000);
let p=0;
let t=setInterval(()=>{
p++;
progressBar.style.width=p+'%';
progressText.innerHTML=p+'%';
if(p>=100){
clearInterval(t);clearInterval(mt);
let percent=(75+(makeSeed(vals.join('|'))%2001)/100).toFixed(1);
scanMessage.innerHTML='✔ AI分析完成，結果已產生';
resultBox.innerHTML=percent+'%';
}
},80);
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(console.error);
  });
}
</script>

</body></html>
